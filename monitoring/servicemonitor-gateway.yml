apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - nginx-gateway
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: http
      interval: 30s
