apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: https://github.com/CharanSai8127/python-aks-platform
    targetRevision: main
    path: gateway-api   # PATH FIX

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway   # PATH FIX

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
